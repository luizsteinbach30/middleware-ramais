{% extends "base.html" %}
{% block title %}Equipamentos — Middleware Monitor{% endblock %}
{% block body %}
<div class="border-b border-gray-800 bg-gray-900/80 backdrop-blur sticky top-0 z-20">
  <div class="px-6 py-4 flex items-center gap-4">
    <div class="flex-1 min-w-0">
      <h1 id="eq-titulo" class="text-lg font-semibold text-gray-100">Equipamentos</h1>
      <p id="eq-contagem" class="text-xs text-gray-400 mt-0.5">—</p>
    </div>
  </div>
</div>
<div class="px-6 py-6 space-y-4">
  <!-- Só leitura: o cadastro nasce no NOC (verbo definir_equipamentos). -->
  <div id="eq-origem" class="flex items-start gap-2 rounded-xl px-4 py-3 bg-blue-500/10 ring-1 ring-blue-500/30 text-xs text-blue-200">
    <span data-icon="eye" class="mt-0.5"></span><span id="eq-origem-texto">—</span>
  </div>

  <div class="bg-gray-800 ring-1 ring-gray-700 rounded-xl p-4 space-y-4">
    <div class="flex items-center justify-between gap-3 flex-wrap">
      <nav id="eq-frentes" class="flex flex-wrap gap-1" aria-label="Frentes"></nav>
      <input id="eq-busca" placeholder="Buscar nome ou endereço" autocomplete="off"
             class="w-full sm:w-64 bg-gray-900 ring-1 ring-inset ring-gray-700 rounded-lg px-3 py-1.5 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
    </div>
    <div id="eq-resumo" class="flex flex-wrap gap-2"></div>
  </div>

  <div class="bg-gray-800 ring-1 ring-gray-700 rounded-xl overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-gray-900/60 text-gray-400 text-xs uppercase tracking-wider">
          <tr>
            <th class="text-left px-4 py-3 font-semibold">Nome</th>
            <th class="text-left px-4 py-3 font-semibold">Tipo</th>
            <th class="text-left px-4 py-3 font-semibold">Endereço</th>
            <th class="text-left px-4 py-3 font-semibold">Estado</th>
            <th class="text-left px-4 py-3 font-semibold">Desde</th>
            <th class="text-left px-4 py-3 font-semibold">Verificações</th>
            <th class="text-left px-4 py-3 font-semibold">Última leitura</th>
          </tr>
        </thead>
        <tbody id="eq-tbody" class="divide-y divide-gray-800">
          <tr><td colspan="7" class="px-4 py-8 text-center text-xs text-gray-500">Carregando…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<script type="module" src="/static/js/pages/equipamentos.js"></script>
{% endblock %}
