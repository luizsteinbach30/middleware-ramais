<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <link rel="icon" href="/api/branding/favicon">
  <title>{% block title %}Middleware USCall Monitor{% endblock %}</title>
  <script src="/static/vendor/tailwindcss.js"></script>
  <link rel="stylesheet" href="/static/css/app.css">
  <script>
    // Aplica o estado da sidebar ANTES do primeiro paint — senão a tela abre
    // expandida e "pula" para recolhida. Sem escolha salva, tela de tablet
    // (até 1279 px, ex.: iPad) abre recolhida; abaixo de 768 px sempre abre
    // recolhida, porque o menu de 16rem tomaria a tela (v2.19.2).
    (function () {
      var salvo = null;
      try { salvo = localStorage.getItem('mm.sidebar'); } catch (_e) { /* bloqueado */ }
      var mm = function (q) { try { return window.matchMedia(q).matches; } catch (_e) { return false; } };
      if (salvo === 'collapsed' || mm('(max-width: 767.98px)') || (salvo === null && mm('(max-width: 1279.98px)'))) {
        document.documentElement.classList.add('sidebar-collapsed');
      }
    })();
  </script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['ui-sans-serif','system-ui'] } } } };
  </script>
  <script type="module" src="/static/js/app.js"></script>
</head>
<body class="bg-gray-900 text-gray-200 antialiased">
  <div class="min-h-screen flex">
    {% if user %}{% include "partials/sidebar.html" %}{% endif %}
    <div class="flex-1 min-w-0 flex flex-col">
      <div id="degraded-banner" class="hidden px-6 py-2 bg-yellow-500/10 border-b border-yellow-500/30 text-xs text-yellow-200 flex items-center gap-2">
        {% include "partials/icon_alert.html" %}
        <span id="degraded-banner-text">Serviço degradado.</span>
        <a href="/logs" class="underline hover:text-yellow-100">Verificar logs</a>
      </div>
      {% block body %}{% endblock %}
    </div>
  </div>
  <div id="toast-root" class="fixed top-4 right-4 z-50 space-y-2"></div>
</body>
</html>
