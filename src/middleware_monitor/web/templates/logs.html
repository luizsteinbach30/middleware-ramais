{% extends "base.html" %}
{% block title %}Logs — Middleware Monitor{% endblock %}
{% block body %}
<div class="border-b border-gray-800 bg-gray-900/80 backdrop-blur sticky top-0 z-20">
  <div class="px-6 py-4 flex items-center gap-4">
    <div class="flex-1 min-w-0">
      <h1 class="text-lg font-semibold text-gray-100">Logs do sistema</h1>
      <p id="logs-subtitle" class="text-xs text-gray-400 mt-0.5">—</p>
    </div>
    <div class="flex items-center gap-2 text-xs text-gray-300">
      <span>Auto-refresh</span>
      <label class="relative inline-block w-11 h-6 cursor-pointer">
        <input type="checkbox" id="logs-auto" class="sr-only peer">
        <span class="absolute inset-0 rounded-full bg-gray-700 peer-checked:bg-blue-500 transition"></span>
        <span class="absolute top-0.5 left-0.5 w-5 h-5 rounded-full bg-white shadow transition-transform peer-checked:translate-x-5"></span>
      </label>
    </div>
  </div>
</div>
<div class="px-6 py-6 space-y-4">
  <div class="bg-gray-800 ring-1 ring-gray-700 rounded-xl p-4">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
      <label class="flex flex-col gap-1.5">
        <span class="text-xs font-semibold text-gray-300">Nível</span>
        <select id="logs-level" class="bg-gray-900 ring-1 ring-inset ring-gray-700 rounded-lg px-3 py-2 text-sm text-gray-100">
          <option value="all">Todos</option><option>DEBUG</option><option>INFO</option><option>WARN</option><option>ERROR</option>
        </select>
      </label>
      <label class="flex flex-col gap-1.5">
        <span class="text-xs font-semibold text-gray-300">Módulo</span>
        <select id="logs-module" class="bg-gray-900 ring-1 ring-inset ring-gray-700 rounded-lg px-3 py-2 text-sm text-gray-100">
          <option value="all">Todos</option>
          <option>collector</option><option>monitor</option><option>webhook</option>
          <option>updater</option><option>auth</option><option>scheduler</option><option>retention</option>
        </select>
      </label>
      <label class="flex flex-col gap-1.5">
        <span class="text-xs font-semibold text-gray-300">Buscar</span>
        <input id="logs-search" placeholder="texto na mensagem" class="bg-gray-900 ring-1 ring-inset ring-gray-700 rounded-lg px-3 py-2 text-sm text-gray-100"/>
      </label>
    </div>
  </div>
  <div class="bg-gray-800 ring-1 ring-gray-700 rounded-xl overflow-hidden">
    <table class="w-full text-sm">
      <thead class="bg-gray-900/60 text-gray-400 text-xs uppercase tracking-wider">
        <tr>
          <th class="text-left px-4 py-3 font-semibold w-44">Timestamp</th>
          <th class="text-left px-4 py-3 font-semibold w-24">Nível</th>
          <th class="text-left px-4 py-3 font-semibold w-32">Módulo</th>
          <th class="text-left px-4 py-3 font-semibold">Mensagem</th>
          <th class="text-right px-4 py-3 font-semibold">Contexto</th>
        </tr>
      </thead>
      <tbody id="logs-tbody" class="divide-y divide-gray-800"></tbody>
    </table>
  </div>
</div>
<div id="logs-modal" class="hidden fixed inset-0 bg-black/60 z-50 grid place-items-center px-4">
  <div class="bg-gray-800 ring-1 ring-gray-700 rounded-xl max-w-xl w-full" onclick="event.stopPropagation()">
    <div class="px-5 py-4 border-b border-gray-700 flex items-center justify-between">
      <h3 id="logs-modal-title" class="text-sm font-semibold text-gray-100">Contexto</h3>
      <button data-close class="text-gray-400 hover:text-gray-100">×</button>
    </div>
    <pre id="logs-modal-content" class="bg-gray-950 px-5 py-4 text-xs font-mono text-gray-300 rounded-b-xl"></pre>
  </div>
</div>
<script type="module" src="/static/js/pages/logs.js"></script>
{% endblock %}
