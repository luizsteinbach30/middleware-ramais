{% extends "base.html" %}
{% block title %}Entrar — Middleware Monitor{% endblock %}
{% block body %}
<div class="min-h-screen grid place-items-center bg-gradient-to-br from-gray-950 via-gray-900 to-gray-950 px-4">
  <div class="w-full max-w-sm">
    <div class="flex flex-col items-center text-center mb-8">
      <div class="w-12 h-12 rounded-xl bg-blue-500/15 ring-1 ring-blue-500/40 grid place-items-center text-blue-400 mb-3">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      </div>
      <h1 class="text-xl font-semibold text-gray-100">Middleware Monitor</h1>
      <p class="text-xs text-gray-500 mt-1">Entre para acessar o painel local</p>
    </div>
    <div class="bg-gray-800 ring-1 ring-gray-700 rounded-xl p-6">
      <form id="login-form" class="space-y-4" novalidate>
        <label class="flex flex-col gap-1.5">
          <span class="text-xs font-semibold text-gray-300">Usuário <span class="text-red-400">*</span></span>
          <input id="username" name="username" autofocus autocomplete="username" placeholder="admin"
                 class="bg-gray-900 ring-1 ring-inset ring-gray-700 rounded-lg px-3 py-2 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
        </label>
        <label class="flex flex-col gap-1.5">
          <span class="text-xs font-semibold text-gray-300">Senha <span class="text-red-400">*</span></span>
          <div class="relative">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••"
                   class="w-full bg-gray-900 ring-1 ring-inset ring-gray-700 rounded-lg px-3 py-2 pr-10 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
            <button type="button" id="toggle-pw" class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-200 p-1.5" aria-label="Mostrar senha">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </label>
        <div id="login-error" class="hidden rounded-lg bg-red-500/10 ring-1 ring-red-500/30 px-3 py-2 text-xs text-red-300 flex items-center gap-2"></div>
        <button type="submit" class="w-full justify-center inline-flex items-center gap-2 rounded-lg font-medium transition-colors bg-blue-500 hover:bg-blue-400 text-white shadow-sm px-3.5 py-2 text-sm">Entrar</button>
      </form>
    </div>
    <div class="text-center text-xs text-gray-600 mt-6">v{{ version }}</div>
  </div>
</div>
<script type="module" src="/static/js/pages/login.js"></script>
{% endblock %}
