{% extends "base.html" %}
{% block title %}Devices — Middleware Monitor{% endblock %}
{% block body %}
<div class="border-b border-gray-800 bg-gray-900/80 backdrop-blur sticky top-0 z-20">
  <div class="px-6 py-4 flex items-center gap-4">
    <div class="flex-1 min-w-0">
      <h1 class="text-lg font-semibold text-gray-100">Devices</h1>
      <p id="dev-count" class="text-xs text-gray-400 mt-0.5">—</p>
    </div>
    <div class="flex items-center gap-2">
      <button data-action="export-csv" class="inline-flex items-center gap-2 rounded-lg font-medium bg-transparent hover:bg-gray-700/60 text-gray-200 ring-1 ring-inset ring-gray-700 px-2.5 py-1.5 text-xs"><span data-icon="download"></span>Exportar CSV</button>
      <button data-action="force-monitor" class="inline-flex items-center gap-2 rounded-lg font-medium bg-blue-500 hover:bg-blue-400 text-white px-2.5 py-1.5 text-xs"><span data-icon="play"></span>Forçar ping</button>
    </div>
  </div>
</div>
<div class="px-6 py-6 space-y-4">
  <div class="bg-gray-800 ring-1 ring-gray-700 rounded-xl p-4">
    <div class="grid grid-cols-1 md:grid-cols-4 gap-3" id="filters">
      <label class="flex flex-col gap-1.5">
        <span class="text-xs font-semibold text-gray-300">Buscar <span class="font-normal text-gray-500">ramal ou IP</span></span>
        <input id="f-search" placeholder="Ex: 3660 ou 10.20.30" class="bg-gray-900 ring-1 ring-inset ring-gray-700 rounded-lg px-3 py-2 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      </label>
      <label class="flex flex-col gap-1.5">
        <span class="text-xs font-semibold text-gray-300">Status de rede</span>
        <select id="f-network" class="bg-gray-900 ring-1 ring-inset ring-gray-700 rounded-lg px-3 py-2 text-sm text-gray-100">
          <option value="all">Todos</option>
          <option value="online">Online</option>
          <option value="offline">Offline</option>
          <option value="unknown">Desconhecido</option>
        </select>
      </label>
      <label class="flex flex-col gap-1.5">
        <span class="text-xs font-semibold text-gray-300">Status lógico</span>
        <select id="f-logical" class="bg-gray-900 ring-1 ring-inset ring-gray-700 rounded-lg px-3 py-2 text-sm text-gray-100">
          <option value="all">Todos</option>
          <option value="available">Disponível</option>
          <option value="unavailable">Indisponível</option>
        </select>
      </label>
      <div class="flex items-end gap-2">
        <button id="f-clear" class="inline-flex items-center gap-2 rounded-lg font-medium bg-transparent hover:bg-gray-700/60 text-gray-200 ring-1 ring-inset ring-gray-700 px-3.5 py-2 text-sm">Limpar</button>
      </div>
    </div>
    <div id="summary-badges" class="flex flex-wrap gap-2 mt-4 pt-4 border-t border-gray-700/50"></div>
  </div>
  <div class="bg-gray-800 ring-1 ring-gray-700 rounded-xl overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-gray-900/60 text-gray-400 text-xs uppercase tracking-wider">
          <tr>
            <th class="text-left px-4 py-3 font-semibold">Ramal</th>
            <th class="text-left px-4 py-3 font-semibold">IP</th>
            <th class="text-left px-4 py-3 font-semibold">MAC</th>
            <th class="text-left px-4 py-3 font-semibold">Modelo</th>
            <th class="text-left px-4 py-3 font-semibold">Vínculo</th>
            <th class="text-left px-4 py-3 font-semibold">USCall</th>
            <th class="text-left px-4 py-3 font-semibold">Rede</th>
            <th class="text-right px-4 py-3 font-semibold">Lat.</th>
            <th class="text-left px-4 py-3 font-semibold">Last seen</th>
            <th class="text-right px-4 py-3 font-semibold">Ações</th>
          </tr>
        </thead>
        <tbody id="devices-tbody" class="divide-y divide-gray-800"></tbody>
      </table>
    </div>
    <div class="px-4 py-3 border-t border-gray-800 flex items-center justify-between text-xs text-gray-500">
      <span id="page-info">—</span>
      <div class="flex gap-1">
        <button id="page-prev" class="inline-flex items-center gap-2 rounded-lg font-medium bg-transparent hover:bg-gray-700/60 text-gray-200 ring-1 ring-inset ring-gray-700 px-2.5 py-1.5 text-xs disabled:opacity-50 disabled:cursor-not-allowed">« Anterior</button>
        <button id="page-next" class="inline-flex items-center gap-2 rounded-lg font-medium bg-transparent hover:bg-gray-700/60 text-gray-200 ring-1 ring-inset ring-gray-700 px-2.5 py-1.5 text-xs disabled:opacity-50 disabled:cursor-not-allowed">Próxima »</button>
      </div>
    </div>
  </div>
</div>
<script type="module" src="/static/js/pages/devices.js"></script>
{% endblock %}
