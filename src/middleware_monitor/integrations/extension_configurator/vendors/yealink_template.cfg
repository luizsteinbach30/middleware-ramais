#!version:1.0.0.1
## Template de provisionamento Yealink (T3x/T4x) — formato MAC-all.cfg (key=value).
##
## REGRA INVIOLAVEL: este template NAO pode conter NENHUMA chave de rede. O
## aparelho aplica configs PARCIAIS (so as chaves presentes), entao tudo que
## NAO enviamos fica preservado: IP/mascara/gateway/DNS/VLAN/QoS/VPN/802.1X
## continuam exatamente como estao. Validado por test_yealink.py (whitelist).
##
## Chaves PROIBIDAS aqui (exemplos): network.*, static.network.*, wan_*, lan_*,
## sip.* (global), wifi.*, vpn.*, dot1x.*, qos.*, *.web_server.*, *.http_port.*
##
## Chaves PERMITIDAS (prefixos): account.1.*, linekey.*, local_time.*,
##                               security.user_password (troca de senha web)
## ----------------------------------------------------------------------------

## Conta SIP provisionada (indice 1 ou 2, conforme sip_account do ambiente)
account.{sip_acct}.enable = {account_active}
account.{sip_acct}.label = {label}
account.{sip_acct}.display_name = {display_name}
account.{sip_acct}.auth_name = {auth_id}
account.{sip_acct}.user_name = {user_id}
account.{sip_acct}.password = {password}
account.{sip_acct}.sip_server.1.address = {sip_server}
account.{sip_acct}.sip_server.1.port = {sip_port}
account.{sip_acct}.sip_server.1.transport_type = {sip_transport}

## Fuso horario (cosmetico — nao e rede)
local_time.time_zone = {timezone}
{function_keys_cfg}
{web_admin_cfg}
