<script>
String.prototype.realLength = function()
{
  return this.replace(/[^\x00-\xff]/g,"**").length;
}
function check_number(num_string)
{ 
    var c; 
	var ch = "0123456789"; 
	for (var i = 0; i < num_string.length; i++){ 
	     c = num_string.charAt(i); 
		 if (ch.indexOf(c) == -1) 
		      return false; 
	} 
	return true; 
}
function fun( k,name)
{
	var reportName;
	if(k.indexOf("#")>=0)
	{ 
		reportName=k;				
		document.getElementById(name).value= reportName;
	}					
	else
		document.getElementById(name).value= k;
}
function doSubmit()
{
	var k;
	var Name;
	var i=0;
	
	var Num = "";
	var MaxAccountNum = parseInt(Num);
	
	for(i = 1; i<= MaxAccountNum; i++)
	{
		if(document.getElementById("NUM"+i))
		 {		
			 k=document.getElementById("NUM"+i).value;
			 Name="NUM"+i;
			fun(k,Name);
		 }
		if(document.getElementById("NAME"+i))
		 {	
			 k=document.getElementById("NAME"+i).value;
			 Name="NAME"+i;
			 fun(k,Name);
		 }
		 
		 if(document.getElementById("pNUM"+i))
		 {		
		 	k=document.getElementById("pNUM"+i).value;
		 	Name="pNUM"+i;
			fun(k,Name);
		 }
		if(document.getElementById("pNAME"+i))
		 {	
			k=document.getElementById("pNAME"+i).value;
			Name="pNAME"+i;
			fun(k,Name);
		}
		
		if(document.getElementById("pNUM"+i).readOnly==false)
		{
			if(document.getElementById("pNUM"+i).value == "")
			{
				alert(myArray["IsDSSKeysLineKeysNumber"]);
				return false;
			}
		}
	}
}

function change(value, i)
{
	if(value=="0" || value=="22"|| value=="23")
	{	
		document.getElementById("pSipAccounts"+i).disabled=true ;
		document.getElementById("pNAME"+i).style.background="#ebebe4";
		document.getElementById("pNUM"+i).style.background="#ebebe4";
		document.getElementById("pNAME"+i).style.cursor="auto";
		document.getElementById("pNUM"+i).style.cursor="auto";
		document.getElementById("pNAME"+i).readOnly=true;
		document.getElementById("pNUM"+i).readOnly=true;
		document.getElementById("LineblfTab"+i).innerHTML="";

		if(value=="23")
		{
			var Num = "";
			var line = parseInt(Num);
			document.getElementById("ptype"+line).disabled=true;
		}
	 }
	else if(value=="4")
	{
		document.getElementById("pSipAccounts"+i).disabled=true ;
		document.getElementById("pNAME"+i).style.background="#fff";
		document.getElementById("pNUM"+i).style.background="#fff";
		document.getElementById("pNAME"+i).style.cursor="text";
		document.getElementById("pNUM"+i).style.cursor="text";
		document.getElementById("pNAME"+i).className="";
		document.getElementById("pNAME"+i).readOnly=false;	
		document.getElementById("pNUM"+i).className="";
		document.getElementById("pNUM"+i).readOnly=false;	
		document.getElementById("LineblfTab"+i).innerHTML="";
	}
	else if(value=="11")
	{
		document.getElementById("pSipAccounts"+i).disabled=false;
		document.getElementById("pNAME"+i).style.background="#fff";
		document.getElementById("pNUM"+i).style.background="#fff";
		document.getElementById("pNAME"+i).style.cursor="text";
		document.getElementById("pNUM"+i).style.cursor="text";
		document.getElementById("pNAME"+i).className="";
		document.getElementById("pNAME"+i).readOnly=false;	
		document.getElementById("pNUM"+i).className="";
		document.getElementById("pNUM"+i).readOnly=false;	 
		document.getElementById("LineblfTab"+i).innerHTML="<a href='/goform/SaveBLFLineCfg?Operate=ShowPhoneBookOfGroup&GID="+i+"'><image border='0' src='edit.gif' alt='modify' /></a>";
	}
	else
	{
		document.getElementById("pSipAccounts"+i).disabled=false;
		document.getElementById("pNAME"+i).style.background="#fff";
		document.getElementById("pNUM"+i).style.background="#fff";
		document.getElementById("pNAME"+i).style.cursor="text";
		document.getElementById("pNUM"+i).style.cursor="text";
		document.getElementById("pNAME"+i).className="";
		document.getElementById("pNAME"+i).readOnly=false;	
		document.getElementById("pNUM"+i).className="";
		document.getElementById("pNUM"+i).readOnly=false;	 
		document.getElementById("LineblfTab"+i).innerHTML="";
	}

}
		
function changehotline(value,i)
