{
	if(id==1)
	{
		
		document.forms[1].action='/goform/SaveSysCfg';

function expandChild(obj)
{
	var childname=obj.parentNode.id.split("_")[0]+"_child";
	var SysConfigIndex=[0,3,5];
	var arr=["Basic_child","Time_child","Lockkeys_child"]; 
	var showID=0;

	{
		child_id=1;
	  	document.getElementById("con_one_1").getElementsByTagName('li')[SysConfigIndex[0]].className="hover"; 
		document.getElementById("con_one_1").getElementsByTagName('li')[SysConfigIndex[1]].className=""; 
		document.getElementById("con_one_1").getElementsByTagName('li')[SysConfigIndex[2]].className="";
		$("#basic_node").show();
		$("#time_setting_node").hide();
		$("#keypad_lock_node").hide();
	}
	else if(childname=="Time_child")
	{
		child_id=2;
	  	document.getElementById("con_one_1").getElementsByTagName('li')[SysConfigIndex[0]].className=""; 
		document.getElementById("con_one_1").getElementsByTagName('li')[SysConfigIndex[1]].className="hover"; 
		document.getElementById("con_one_1").getElementsByTagName('li')[SysConfigIndex[2]].className=""; 
		$("#basic_node").hide();
		$("#time_setting_node").show();
		$("#keypad_lock_node").hide();
	}
	else if(childname=="Lockkeys_child")
	{
		child_id=3;
	  	document.getElementById("con_one_1").getElementsByTagName('li')[SysConfigIndex[0]].className=""; 
		document.getElementById("con_one_1").getElementsByTagName('li')[SysConfigIndex[1]].className=""; 
		document.getElementById("con_one_1").getElementsByTagName('li')[SysConfigIndex[2]].className="hover";
		$("#basic_node").hide();
		$("#time_setting_node").hide();
		$("#keypad_lock_node").show();
	}
	else
	{
		child_id=0;
	    SetURLCookie("SysConfig",childname);
		return true;
	}
	for(var i=0;i<arr.length;i++)
	{
		/* Modified by Yulong on 2017.06.20 for Features page display is hide and bugID are DFV-890, DFV-374. */
		if(arr[i]==childname)
		{	
			/*
			document.getElementById(childname).style.display="";
			*/
			showID = i;
			SetURLCookie("SysConfig",childname);
		}
		else
			document.getElementById(arr[i]).style.display="none";
	}
	
	/* Modified by Yulong on 2017.06.20 for Features page display is hide and bugID are DFV-890, DFV-374. */
	if(arr[showID]==childname)
	{
		document.getElementById(childname).style.display="";
	}
}

} 
}
