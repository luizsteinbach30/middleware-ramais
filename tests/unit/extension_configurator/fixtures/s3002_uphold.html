<script language="JavaScript">
function checkObjOnStr(input, str)
{
	var alive_num=0;	
	for (var i = 0; i < input.length; ++i)
	{
		if (str.indexOf(input.charAt(i)) != -1)
			alive_num = alive_num+1;
	}
	if(alive_num>0)
		return true;
	else
		return false;
}

function checkillegalNumeric(input)
{
	var str = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789`~!@#$%^&*()-_+=[]{}\\|;:\"'<>.,?/";
	for (var i = 0; i < input.length; ++i)
	{
		if (str.indexOf(input.charAt(i)) == -1)
			return false;
	}
	return true;
}

function checkRelatedToStr(input, str)
{
	if(str.length > 0)
	{
		if (input.toLowerCase().indexOf(str.toLowerCase()) != -1)
		{
			alert(myArray["Passworderror8chars"]);
			return false;
		}
	}
	return true;
}

function checkWebPassword(input)
{
	var SpecialChar = "`~!@#$%^&*()-_+=[]{}\\|;:\"'<>.,?/";
	var alphabet_a = 'abcdefghijklmnopqrstuvwxyz';var alphabet_A = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';	
	var a1=0;var a2=0;var a3=0;var a4=0;
	
	if(checkObjOnStr(input, SpecialChar)==true)
		a1=1;	
	if(checkObjOnStr(input, alphabet_a)==true)
		a2=1;	
	if(checkObjOnStr(input, alphabet_A)==true)
		a3=1;
	if(checkillegalNumeric(input)==true)
		a4=1;
	if(a1 == 1 && a2 == 1 && a3 == 1 && a4 == 1 && input.length>=16)
	{
		if(checkRelatedToStr(input,document.forms[0].sipname1.value) == false)
			return false;
		if(checkRelatedToStr(input,document.forms[0].sipnumber1.value) == false)
			return false;
		if(checkRelatedToStr(input,document.forms[0].sipname2.value) == false)
			return false;
		if(checkRelatedToStr(input,document.forms[0].sipnumber2.value) == false)
			return false;
		if(checkRelatedToStr(input,document.forms[0].phonemac.value) == false)
			return false;
	}
	else
	{		
		alert(myArray["Passworderror15chars"]);
		return false;
	}
	return true;
}

function checkWebPassword8Above(input)
{
	var SpecialChar = "`~!@#$%^&*()-_+=[]{}\\|;:\"'<>.,?/";
	var alphabet_a = 'abcdefghijklmnopqrstuvwxyz';var alphabet_A = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
	var a1=0;var a2=0;var a3=0;
	
	if(checkObjOnStr(input, SpecialChar)==true)
		a1=1;	
	if(checkObjOnStr(input, alphabet_a)==true)
		a2=1;	
	if(checkObjOnStr(input, alphabet_A)==true)
		a3=1;
	if(a1 == 1 && a2 == 1 && a3 == 1 && input.length>=8)
	{
		return true;
	}
	else
	{		
		alert(myArray["alertPassworderror8chars"]);
		return false;
	}
	return true;
}

function charCompareA(szname,en_limit,cn_limit){
	var c;var ch = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789`~!@#$%^&*()-_+=[]{}\\|;:\"'<>.,?/";
	if(szname.length > en_limit) 
		return false;
	for (var i = 0; i < szname.length; i++){
		c = szname.charAt(i);
		if (ch.indexOf(c) == -1){
			if(szname.length > cn_limit)
			return false;
		}
	}
	return true;
}

function doSubmit(){
     if(document.forms[0].UserName.value==""){
	 	alert(myArray["PPPUsr"]);
		var element = document.forms[0].PwdOld;
		if(element){
			element.focus();

		}
		return false;
	 }
	 if(document.forms[0].PwdOld.value==""){
	 	alert(myArray["oldpassword"]);
		var element = document.forms[0].PwdOld;
		if(element){
			element.focus();
			element.select();
		}
		return false;
	 }
	  if(document.forms[0].PwdNew.value==""){
	 	alert(myArray["newpassword"]);
		var element = document.forms[0].PwdOld;
		if(element){
			element.focus();
			element.select();
		}
		return false;
	 }
	  if(document.forms[0].PwdConfirm.value==""){
	 	alert(myArray["Confirmpassword"]);
		var element = document.forms[0].PwdOld;
		if(element){
			element.focus();
			element.select();
		}
		return false;
	 }
	 
	if(document.title == "GNT-1200E")
	{
	 	if(checkWebPassword(document.forms[0].PwdNew.value)==false)
			return false;
	}
	else if(document.title == "S3002")
	{
	 	if(checkWebPassword8Above(document.forms[0].PwdNew.value)==false)
			return false;
	}
	else
	{
		if(!charCompareA(document.forms[0].PwdNew.value,14,0)){
			alert(myArray["Passworderror"]);
			var element = document.forms[0].PwdNew;
			if(element){
				element.focus();
				element.select();
			}
			return false;
		}
	 }
		 
	if(document.forms[0].PwdNew.value != document.forms[0].PwdConfirm.value){
		alert(myArray["Confirmpassword"]);
		var element = document.forms[0].PwdConfirm;
		if(element){
			element.focus();
			element.select();
		}
		return false;
	}
	
	if(document.getElementById("admin").checked)
	{	
		if(document.forms[0].PwdNew.value == document.forms[0].cmima.value)
		{			
			return confirm(myArray["newpasswordissame"]);
		}
	}
	
	if(document.getElementById("user").checked)
	{
		if(document.forms[0].PwdNew.value == document.forms[0].pmima.value)
		{
			return confirm(myArray["newpasswordissame"]);
		}
	}
	
	return true;	
}
