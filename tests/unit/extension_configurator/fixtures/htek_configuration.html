      function upload_cfgfile()
      {
        var strsubmit  = document.getElementById("restore").value;
        var fileObj    = document.getElementById("restore");
        var ExpandName = strsubmit.substring(strsubmit.length - 4, strsubmit.length).toUpperCase();
        var HeadName   = strsubmit.substring(0, 3).toUpperCase();
        var ExpFlag    = strsubmit.substring(strsubmit.length - 4, strsubmit.length - 3);
        var HeadName1  = strsubmit.substring(strsubmit.length - 15, strsubmit.length - 12).toUpperCase();

        if(strsubmit.length > 48)
        {
            alert(jscs.filename_len_over_48_warning);
            return false;
        }

        if(strsubmit=="")
        {
            alert(jscs.pls_select_file);
            return false;
        }

        /* 上传文件没有扩展名时,Chorme AND IE 的上传的文件 
           会变成路径 C:/fakepath/xxxxxxxxx的形式这里做一下适配 */
        if ( ExpFlag == "." )
        {
            /* 有扩展名 */
            if( ExpandName != ".BIN" )
            {
                alert(jscs.format_bin_cfgmac_needed);
                return false;
            }
        }
        else
        {
            if ( HeadName1 != "CFG" )
            {
                alert(jscs.format_bin_cfgmac_needed);
                return false;
            }
        }

        if (!fileSizeLimit(fileObj))
        {
            alert(jscs.file_len_over_100k_warning);
            return false;
        }
        
        if(confirm(jscs.reboot_to_save_new_changes))
        {
            document.formUploadCfg.submit();
        }
        else
        {
            alert(jscs.n_operation_discarded);
            return false;
        }

      }

      function upload_xml_cfgfile()
      {
        var strsubmit = document.getElementById("restore_xml").value;
        var fileObj   = document.getElementById("restore_xml");
        var ExpandName = strsubmit.substring(strsubmit.length - 4, strsubmit.length).toUpperCase();

        //alert(strsubmit);
        //alert(ExpandName);

        if(strsubmit.length > 48)
        {
            alert(jscs.filename_len_over_48_warning);
            return false;
        }

        if(strsubmit=="")
        {
            alert(jscs.pls_select_file);
            return false;
        }
        else if(ExpandName != ".XML")
        {
            alert(jscs.format_xml_needed);
            return false;
        }

        if (!fileSizeLimit(fileObj))
        {
            alert(jscs.file_len_over_100k_warning);
            return false;
        }
        
        if(confirm(jscs.reboot_to_save_new_changes))
        {
            document.formUploadxmlCfg.submit();
        }
        else
        {
            alert(jscs.n_operation_discarded);
            return false;
        }

      }

      function fileSizeLimit(target)
      {
        var fileSize = 0;
        if(isIEBrowser() && !target.files)
        {
            var filePath = target.value;
            try{
                var objFSO = new ActiveXObject("Scripting.FileSystemObject");
                var file = objFSO.getFile(filePath);
                fileSize = file.Size;
            }catch(e){
                return true;
            }

        }
        else
        {
            fileSize = target.files[0].size;
        }

        var size = fileSize / 1024;
        //alert(size);
        if(size > 500)
        {
            return false;
        }
        return true;
    }

    function isIEBrowser()
    {
        var Sys = {};
        var ua = navigator.userAgent.toLowerCase();
        var s;
            (s = ua.match(/msie ([\d.]+)/)) ? Sys.ie = s[1] :
            (s = ua.match(/firefox\/([\d.]+)/)) ? Sys.firefox = s[1] :
            (s = ua.match(/chrome\/([\d.]+)/)) ? Sys.chrome = s[1] :
            (s = ua.match(/opera.([\d.]+)/)) ? Sys.opera = s[1] :
            (s = ua.match(/version\/([\d.]+).*safari/)) ? Sys.safari = s[1] : 0;
        if(Sys.ie){
            return true;
        } else {
            return false;
        }
    }
