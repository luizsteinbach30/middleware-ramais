    function upload_imgfile()
    {
        var strsubmit = document.getElementById("upgrade_img").value;
        var fileObj   = document.getElementById("upgrade_img");
        var ExpandName = strsubmit.substring(strsubmit.length - 4, strsubmit.length).toUpperCase();

        //alert(strsubmit);
        //alert(ExpandName);

        if(strsubmit.length > 48)
        {
            alert(jscs.filename_len_over_48_warning);
            return false;
        }

        if(strsubmit=="")
        {
            alert(jscs.please_select_file);
            return false;
        }
        else if(ExpandName != ".BIN")
        {
            if (ExpandName != ".ROM")
            {
                alert(jscs.format_rom_bin_needed);
                return false;
            }
        }

        if(ExpandName == ".BIN")
        {
            if (!ImgSizeLimit(fileObj))
            {
                //alert("File size should be less than 6M bytes and large than 3M bytes!");
                return false;
            }
        }

        if(ExpandName == ".ROM")
        {
            if (!RomSizeLimit(fileObj))
            {
                //alert("File size should be less than 16M bytes and large than 64K bytes!");
                return false;
            }
        }
        document.getElementById("upgrade").disabled = true;
        document.getElementById("upload_note").style = "display:block";
        document.formUploadImg.submit();
    }

    function RomSizeLimit(target)
    {
        var fileSize = 0;
        if(isIEBrowser() && !target.files)
        {
            var filePath = target.value;
            try{
                var objFSO = new ActiveXObject("Scripting.FileSystemObject");
                var file = objFSO.getFile(filePath);
                fileSize = file.Size;
            }catch(e){
                return true;
            }

        }
        else
        {
            fileSize = target.files[0].size;
        }

        var size = fileSize / 1024;
        //alert(size);
        if(size < 64)       //64K
        {
            alert(jscs.rom_file_min_size_required);
            return false;
        }
        if(size > 100*1024)    //100M
        {
            alert(jscs.rom_file_max_size_over_warning);
            return false;
        }
        return true;
    }

    function ImgSizeLimit(target)
    {
        var fileSize = 0;
        if(isIEBrowser() && !target.files)
        {
            var filePath = target.value;
            try{
                var objFSO = new ActiveXObject("Scripting.FileSystemObject");
                var file = objFSO.getFile(filePath);
                fileSize = file.Size;
            }catch(e){
                return true;
            }

        }
        else
        {
            fileSize = target.files[0].size;
        }

        var size = fileSize / 1024;
        //alert(size);
        if(size < 3072)  //3M
        {
            alert(jscs.img_file_min_size_required);
            return false;
        }
        if(size > 6144)  //6M
        {
            alert(jscs.img_file_max_size_over_warning);
            return false;
        }
        return true;
    }

    function isIEBrowser()
    {
        var Sys = {};
        var ua = navigator.userAgent.toLowerCase();
        var s;
            (s = ua.match(/msie ([\d.]+)/)) ? Sys.ie = s[1] :
            (s = ua.match(/firefox\/([\d.]+)/)) ? Sys.firefox = s[1] :
            (s = ua.match(/chrome\/([\d.]+)/)) ? Sys.chrome = s[1] :
            (s = ua.match(/opera.([\d.]+)/)) ? Sys.opera = s[1] :
            (s = ua.match(/version\/([\d.]+).*safari/)) ? Sys.safari = s[1] : 0;
        if(Sys.ie){
            return true;
        } else {
            return false;
        }
    }
