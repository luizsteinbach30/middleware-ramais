{% extends "base.html" %}
{% block content %}

<div class="max-w-7xl mx-auto">

    <div class="mb-6">
        <h2 class="text-3xl font-bold text-white">Histórico de Coletas</h2>
        <p class="text-gray-400 text-sm">Navegue pelas coletas realizadas</p>
    </div>

    <!-- FILTER -->
    <div class="bg-gray-900 border border-gray-700 rounded-xl p-4 mb-6 flex items-center gap-4">

        <input id="filterInput"
               type="text"
               placeholder="Filtrar por nome do arquivo..."
               class="bg-gray-800 text-white px-4 py-2 rounded w-96 border border-gray-700 focus:outline-none focus:border-blue-500" />

        <button onclick="clearFilter()"
                class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded">
            Limpar
        </button>

        <div class="ml-auto text-sm text-gray-400">
            Mostrando <span id="resultCount">0</span> arquivos
        </div>

    </div>

    <div class="grid grid-cols-2 gap-8">

        <!-- LIST -->
        <div class="bg-gray-900 border border-gray-700 rounded-xl shadow-lg flex flex-col">

            <div class="px-5 py-4 border-b border-gray-700">
                <h3 class="text-blue-400 text-lg font-semibold">
                    Coletas
                </h3>
            </div>

            <div id="extensions_list"
                 class="flex-1 overflow-auto p-4 text-sm space-y-2">
            </div>

            <!-- PAGINATION -->
            <div class="flex items-center justify-between px-4 py-3 border-t border-gray-700">

                <button onclick="prevPage()"
                        class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded text-sm">
                    ⬅ Anterior
                </button>

                <span id="pageInfo" class="text-gray-400 text-sm"></span>

                <button onclick="nextPage()"
                        class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded text-sm">
                    Próximo ➡
                </button>

            </div>

        </div>

        <!-- VIEWER -->
        <div class="bg-gray-900 border border-gray-700 rounded-xl shadow-lg flex flex-col">

            <div class="px-5 py-4 border-b border-gray-700">
                <h3 class="text-blue-400 text-lg font-semibold">
                    Conteúdo JSON
                </h3>
            </div>

            <div id="viewer"
                 class="flex-1 overflow-auto p-4 text-xs font-mono text-green-300 bg-black rounded-b-xl">
            </div>

        </div>

    </div>

</div>

<script>

    let allFiles = []
    let filteredFiles = []

    let currentPage = 1
    const pageSize = 10

    async function loadCollections() {

        const res = await fetch('/api/collections/extensions')
        const files = await res.json()

        allFiles = files.reverse()

        applyFilter()
    }

    function applyFilter() {

        const filter = document.getElementById("filterInput").value.toLowerCase()

        filteredFiles = allFiles.filter(f =>
            f.toLowerCase().includes(filter)
        )

        currentPage = 1

        renderList()
    }

    function renderList() {

        const container = document.getElementById("extensions_list")

        const start = (currentPage - 1) * pageSize
        const end = start + pageSize

        const pageItems = filteredFiles.slice(start, end)

        document.getElementById("resultCount").innerText = filteredFiles.length

        container.innerHTML = pageItems.map(f =>

            `<div class="flex items-center justify-between bg-gray-800 hover:bg-gray-700 transition rounded-lg px-3 py-2">

            <span class="text-gray-200">${f}</span>

            <button onclick="viewFile('${f}')"
                class="text-green-400 hover:text-green-300 text-xs font-semibold">
                Ver JSON
            </button>

        </div>`

        ).join('')

        updatePageInfo()
    }

    function updatePageInfo() {

        const totalPages = Math.ceil(filteredFiles.length / pageSize)

        document.getElementById("pageInfo").innerText =
            `Página ${currentPage} de ${totalPages || 1}`
    }

    function nextPage() {

        const totalPages = Math.ceil(filteredFiles.length / pageSize)

        if (currentPage < totalPages) {

            currentPage++
            renderList()

        }
    }

    function prevPage() {

        if (currentPage > 1) {

            currentPage--
            renderList()

        }
    }

    async function viewFile(filename) {

        const res = await fetch(`/api/collections/extensions/${filename}`)
        const data = await res.json()

        document.getElementById("viewer").innerText =
            JSON.stringify(data, null, 2)
    }

    function clearFilter() {

        document.getElementById("filterInput").value = ""
        applyFilter()
    }

    document.getElementById("filterInput")
        .addEventListener("keyup", applyFilter)

    loadCollections()

</script>

{% endblock %}
