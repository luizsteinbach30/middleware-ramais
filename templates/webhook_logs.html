{% extends "base.html" %}
{% block content %}

<h2 class="text-2xl font-bold mb-6 text-white">Webhook Logs</h2>

<!-- BOTÕES DE TESTE -->
<div class="flex gap-4 mb-6">

    <button onclick="sendTest('extensions')"
            class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded text-sm">
        Testar Webhook Extensions
    </button>

    <button onclick="sendTest('devices')"
            class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded text-sm">
        Testar Webhook Devices
    </button>

</div>

<div class="bg-gray-800 rounded-lg shadow overflow-hidden">
    <table class="w-full text-sm">
        <thead class="bg-gray-700 text-gray-300">
            <tr>
                <th class="p-3 text-left">Data</th>
                <th class="p-3 text-left">Tipo</th>
                <th class="p-3 text-left">HTTP</th>
                <th class="p-3 text-left">Tempo</th>
                <th class="p-3 text-left">Status</th>
                <th class="p-3 text-left">Ação</th>
            </tr>
        </thead>
        <tbody id="logs_table" class="divide-y divide-gray-700"></tbody>
    </table>
</div>

<!-- MODAL JSON -->
<div id="jsonModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50">
    <div class="bg-gray-800 w-2/3 max-h-[80vh] overflow-auto rounded-lg shadow-lg p-6">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-semibold text-white">Webhook JSON</h3>
            <button onclick="closeModal()" class="text-red-400 hover:text-red-500">
                Fechar
            </button>
        </div>
        <pre id="jsonContent" class="text-sm text-gray-300 whitespace-pre-wrap"></pre>
    </div>
</div>

<script>

    async function loadLogs() {
        const res = await fetch('/api/webhook-logs/');
        const logs = await res.json();

        const table = document.getElementById("logs_table");

        table.innerHTML = logs.reverse().map(l => {

            const isTest = l.payload && l.payload.test;

            return `
            <tr class="hover:bg-gray-700/40 ${isTest ? 'bg-blue-900/30' : ''}">
                <td class="p-3 text-gray-300">${l.timestamp}</td>

                <td class="p-3 ${isTest ? 'text-purple-400' : 'text-blue-400'}">
                    ${l.type}
                    ${isTest ? '<span class="ml-2 text-xs text-purple-300">(TESTE)</span>' : ''}
                </td>

                <td class="p-3 text-gray-300">${l.http_status || '-'}</td>

                <td class="p-3 text-gray-300">${l.duration_ms || 0} ms</td>

                <td class="p-3 ${l.success ? 'text-green-400' : 'text-red-400'} font-semibold">
                    ${l.success ? 'Sucesso' : 'Falha'}
                </td>

                <td class="p-3">
                    <button onclick='showJSON(${JSON.stringify(JSON.stringify(l))})'
                        class="bg-gray-600 hover:bg-gray-500 px-3 py-1 rounded text-xs">
                        Ver JSON
                    </button>
                </td>
            </tr>
            `;
        }).join('');
    }

    async function sendTest(type) {
        const res = await fetch('/api/webhooks/test/' + type, {
            method: 'POST'
        });

        const data = await res.json();

        loadLogs();
    }

    function showJSON(data) {
        const parsed = JSON.parse(data);
        document.getElementById("jsonContent").textContent =
            JSON.stringify(parsed, null, 2);

        document.getElementById("jsonModal").classList.remove("hidden");
        document.getElementById("jsonModal").classList.add("flex");
    }

    function closeModal() {
        document.getElementById("jsonModal").classList.add("hidden");
        document.getElementById("jsonModal").classList.remove("flex");
    }

    loadLogs();
    setInterval(loadLogs, 5000);

</script>

{% endblock %}
