<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Middleware Monitor</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <style>

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1f2937;
        }

        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 6px;
        }
    </style>

</head>

<body class="bg-gray-900 text-gray-200 font-sans">

    <div class="flex h-screen">

        <!-- SIDEBAR -->
        <aside class="w-64 bg-gray-950 border-r border-gray-800 flex flex-col">

            <div class="p-5 border-b border-gray-800">

                <h1 class="text-xl font-bold tracking-wide flex items-center gap-2">
                    <i class="fa-solid fa-server text-indigo-400"></i>
                    Middleware
                </h1>

                <p class="text-xs text-gray-500 mt-1">
                    Monitoramento
                </p>

            </div>

            <nav class="flex-1 p-4 space-y-2 text-sm">

                <a href="/"
                   class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-800 transition">

                    <i class="fa-solid fa-chart-line text-gray-400 w-5"></i>
                    Dashboard

                </a>

                <a href="/devices"
                   class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-800 transition">

                    <i class="fa-solid fa-microchip text-gray-400 w-5"></i>
                    Devices

                </a>

                <a href="/collections"
                   class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-800 transition">

                    <i class="fa-solid fa-database text-gray-400 w-5"></i>
                    Histórico

                </a>

                <a href="/webhook-logs"
                   class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-800 transition">

                    <i class="fa-solid fa-plug text-gray-400 w-5"></i>
                    Webhook Logs

                </a>

                <a href="/config"
                   class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-800 transition">

                    <i class="fa-solid fa-gear text-gray-400 w-5"></i>
                    Configuração

                </a>

            </nav>

            <div class="p-4 border-t border-gray-800 text-xs text-gray-500">

                Middleware Monitor<br>
                v1.0

            </div>

        </aside>

        <!-- MAIN AREA -->
        <div class="flex-1 flex flex-col overflow-hidden">

            <!-- HEADER -->
            <header class="bg-gray-950 border-b border-gray-800 px-6 py-3 flex items-center justify-between">

                <div class="flex items-center gap-3">

                    <h2 class="text-lg font-semibold">
                        Painel
                    </h2>

                </div>

                <div class="flex items-center gap-4 text-sm text-gray-400">

                    <span>
                        Sistema ativo
                    </span>

                    <div class="w-2 h-2 bg-green-400 rounded-full"></div>

                </div>

            </header>

            <!-- CONTENT -->
            <main class="flex-1 overflow-auto p-6 bg-gray-900">

                <div class="max-w-7xl mx-auto">

                    {% block content %}
                    {% endblock %}

                </div>

            </main>

        </div>

    </div>

</body>
</html>
