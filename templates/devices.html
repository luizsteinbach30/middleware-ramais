{% extends "base.html" %}
{% block content %}

<h2 class="text-2xl font-bold mb-6">NOC - Devices Monitor</h2>

<!-- CARDS RESUMO -->
<div class="grid grid-cols-4 gap-6 mb-6">

    <div class="bg-gray-800 p-4 rounded">
        <div class="text-sm text-gray-400">USCall Available</div>
        <div id="logical_online" class="text-xl text-blue-400">0</div>
    </div>

    <div class="bg-gray-800 p-4 rounded">
        <div class="text-sm text-gray-400">USCall Unavailable</div>
        <div id="logical_offline" class="text-xl text-yellow-400">0</div>
    </div>

    <div class="bg-gray-800 p-4 rounded">
        <div class="text-sm text-gray-400">Network Online</div>
        <div id="net_online" class="text-xl text-green-400">0</div>
    </div>

    <div class="bg-gray-800 p-4 rounded">
        <div class="text-sm text-gray-400">Network Offline</div>
        <div id="net_offline" class="text-xl text-red-400">0</div>
    </div>

</div>

<!-- BOTÃO FORÇAR -->
<div class="flex justify-end mb-4">
    <button onclick="forceMonitor()"
            class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded">
        Forçar Ping
    </button>
</div>

<!-- TABELA -->
<div class="bg-gray-800 rounded overflow-hidden">
    <table class="w-full text-sm">
        <thead class="bg-gray-700 text-gray-300">
            <tr>
                <th class="p-3 text-left">Ramal</th>
                <th class="p-3 text-left">IP</th>
                <th class="p-3 text-left">MAC</th>
                <th class="p-3 text-left">Modelo</th>
                <th class="p-3 text-left">USCall</th>
                <th class="p-3 text-left">Network</th>
                <th class="p-3 text-left">Latency (ms)</th>
                <th class="p-3 text-left">Last Seen</th>
                <th class="p-3 text-left">Last Ping</th>
                <th class="p-3 text-left">Ações</th>
            </tr>
        </thead>
        <tbody id="devices_table" class="divide-y divide-gray-700"></tbody>
    </table>
</div>

<script>

    async function loadDevices() {
        const res = await fetch('/api/devices/');
        const devices = await res.json();

        let logicalOnline = 0;
        let logicalOffline = 0;
        let netOnline = 0;
        let netOffline = 0;

        const table = document.getElementById("devices_table");

        table.innerHTML = devices.map(d => {

            // CONTADORES CORRIGIDOS
            if (d.logical_status === "disponivel") logicalOnline++;
            else logicalOffline++;

            if (d.status === "online") netOnline++;
            else netOffline++;

            return `
        <tr>
            <td class="p-3 font-semibold">${d.name}</td>
            <td class="p-3">${d.ip || '-'}</td>
            <td class="p-3">${d.mac || '-'}</td>
            <td class="p-3">-</td>

            <td class="p-3">
                <span class="${d.logical_status === 'disponivel' ? 'text-blue-400' : 'text-yellow-400'}">
                    ${d.logical_status || '-'}
                </span>
            </td>

            <td class="p-3">
                <span class="${d.status === 'online' ? 'text-green-400' : 'text-red-400'}">
                    ${d.status || '-'}
                </span>
            </td>

            <td class="p-3">${d.latency ?? '-'}</td>
            <td class="p-3">-</td>
            <td class="p-3">${d.last_ping || '-'}</td>

            <td class="p-3">
                <button onclick="openChart('${d.name}')"
                        class="bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded text-xs">
                    Gráfico
                </button>
            </td>
        </tr>
        `;
        }).join('');

        document.getElementById("logical_online").innerText = logicalOnline;
        document.getElementById("logical_offline").innerText = logicalOffline;
        document.getElementById("net_online").innerText = netOnline;
        document.getElementById("net_offline").innerText = netOffline;
    }

    async function forceMonitor() {
        await fetch('/api/devices/force-monitor', { method: 'POST' });
        loadDevices();
    }

    function openChart(device) {
        window.location.href = "/devices/" + device;
    }

    loadDevices();
    setInterval(loadDevices, 5000);

</script>

{% endblock %}
