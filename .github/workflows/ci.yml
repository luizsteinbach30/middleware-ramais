name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  test:
    name: Lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # O `node` faz o parse dos módulos JS servidos pela web
      # (tests/unit/web/test_static_js_syntax.py). Sem ele o teste seria pulado
      # e um SyntaxError voltaria a passar por CI verde até o navegador do
      # usuário — foi assim que a tela Config padrão ficou quebrada da v2.8.0
      # à v2.10.0.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,metrics]"

      - name: Ruff
        run: ruff check src tests

      - name: Mypy
        run: mypy src

      - name: Pytest
        run: pytest --cov=src/middleware_monitor --cov-report=xml --cov-fail-under=60

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
