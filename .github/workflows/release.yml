name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate version matches tag
        run: |
          PY_VERSION=$(python -c "import sys; sys.path.insert(0, 'src'); from middleware_monitor.version import __version__; print(__version__)")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PY_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::version.py says $PY_VERSION but tag is $TAG_VERSION"
            exit 1
          fi

      - name: Build tarball
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          STAGE="app-v${VER}"
          mkdir -p dist "$STAGE"
          cp -r src pyproject.toml alembic.ini docs README.md CHANGELOG.md "$STAGE/" 2>/dev/null || true
          # Lock file (simple — same as install set):
          python -m pip install -q pip-tools
          (echo "fastapi"; echo "uvicorn[standard]"; echo "sqlalchemy"; echo "alembic"; echo "pydantic"; echo "pydantic-settings"; echo "structlog"; echo "httpx"; echo "jinja2"; echo "passlib[bcrypt]"; echo "itsdangerous"; echo "cryptography"; echo "apscheduler"; echo "python-multipart"; echo "packaging") > requirements.in
          pip-compile --quiet --resolver=backtracking requirements.in -o "$STAGE/requirements.lock" || cp requirements.in "$STAGE/requirements.lock"
          tar --owner=0 --group=0 --numeric-owner --sort=name -czf "dist/$STAGE.tar.gz" "$STAGE"
          ( cd dist && sha256sum "$STAGE.tar.gz" > SHA256SUMS )

      - name: Generate release notes
        run: |
          if [ -f CHANGELOG.md ]; then
            awk '/^## /{n++} n==1' CHANGELOG.md > dist/RELEASE_NOTES.md
          else
            echo "Release ${GITHUB_REF_NAME}" > dist/RELEASE_NOTES.md
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
