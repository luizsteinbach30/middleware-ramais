name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versão para build manual (ex.: 2.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build-tarball:
    name: Build source tarball
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate version matches code
        run: |
          PY_VERSION=$(python -c "import sys; sys.path.insert(0, 'src'); from middleware_monitor.version import __version__; print(__version__)")
          if [ "$PY_VERSION" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::src/middleware_monitor/version.py says $PY_VERSION but tag/input is ${{ steps.ver.outputs.version }}"
            exit 1
          fi

      - name: Inject update token
        env:
          UPDATE_READ_TOKEN: ${{ secrets.UPDATE_READ_TOKEN }}
        run: python scripts/inject_update_token.py

      - name: Build source tarball
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          STAGE="app-v${VER}"
          mkdir -p dist "$STAGE"
          cp -r src pyproject.toml alembic.ini docs README.md CHANGELOG.md "$STAGE/" 2>/dev/null || true
          cp -r scripts "$STAGE/" 2>/dev/null || true
          tar --owner=0 --group=0 --numeric-owner --sort=name -czf "dist/$STAGE.tar.gz" "$STAGE"
          ( cd dist && sha256sum "$STAGE.tar.gz" > SHA256SUMS_tarball.txt )

      - uses: actions/upload-artifact@v4
        with:
          name: source-tarball
          path: |
            dist/app-v*.tar.gz
            dist/SHA256SUMS_tarball.txt

  build-linux-installer:
    name: Build Linux .run installer
    runs-on: ubuntu-latest
    needs: build-tarball
    steps:
      - uses: actions/checkout@v4

      # Só para o script de injeção do token. O .run leva CPython próprio
      # (python-build-standalone), baixado por packaging/linux/build_installer.sh,
      # e é com ele que as wheels são resolvidas — não com este Python.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y makeself

      - name: Inject update token
        env:
          UPDATE_READ_TOKEN: ${{ secrets.UPDATE_READ_TOKEN }}
        run: python scripts/inject_update_token.py

      - name: Build installer
        env:
          VERSION: ${{ needs.build-tarball.outputs.version }}
        run: bash packaging/linux/build_installer.sh

      - name: Stage one-line installer (install.sh)
        run: cp packaging/linux/install.sh dist/install.sh

      - name: Hash installer
        run: |
          ( cd dist && sha256sum middleware-monitor-installer-*.run install.sh > SHA256SUMS_linux.txt )

      - uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: |
            dist/middleware-monitor-installer-*.run
            dist/install.sh
            dist/SHA256SUMS_linux.txt

  build-windows-exe:
    name: Build Windows standalone .exe (PyInstaller)
    runs-on: windows-latest
    needs: build-tarball
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install --upgrade pyinstaller==6.10.0
          # Constraints: build reprodutível. Sem isso cada release empacotava
          # o que estivesse mais novo no PyPI — foi assim que o structlog 26
          # entrou no .exe da v2.7.0/2.7.1 e quebrou o boot (janela congelada
          # em "Iniciando..."). Atualização de dependência agora é mudança
          # deliberada em packaging/constraints-build.txt, testada antes.
          python -m pip install -e ".[metrics]" -c packaging/constraints-build.txt

      - name: Inject update token
        shell: pwsh
        env:
          UPDATE_READ_TOKEN: ${{ secrets.UPDATE_READ_TOKEN }}
        run: python scripts/inject_update_token.py

      - name: Build .exe via PyInstaller
        shell: pwsh
        run: |
          $version = "${{ needs.build-tarball.outputs.version }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          if (Test-Path build\pyinstaller) { Remove-Item -Recurse -Force build\pyinstaller }
          python -m PyInstaller --noconfirm --clean --distpath dist --workpath build\pyinstaller `
            packaging\windows\exe\MiddlewareMonitor.spec
          $src = "dist\MiddlewareMonitor.exe"
          $final = "dist\MiddlewareMonitor-$version.exe"
          if (-not (Test-Path $src)) { throw "PyInstaller did not produce $src" }
          Move-Item $src $final
          $hash = (Get-FileHash $final -Algorithm SHA256).Hash.ToLower()
          "$hash  MiddlewareMonitor-$version.exe" | Set-Content dist\SHA256SUMS_windows.txt
          Get-Item $final | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            dist/MiddlewareMonitor-*.exe
            dist/SHA256SUMS_windows.txt

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-tarball, build-linux-installer, build-windows-exe]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate release notes
        run: |
          if [ -f CHANGELOG.md ]; then
            awk '/^## /{n++} n==1' CHANGELOG.md > dist/RELEASE_NOTES.md
          else
            echo "Release ${GITHUB_REF_NAME}" > dist/RELEASE_NOTES.md
          fi

      - name: Aggregate SHA256SUMS
        run: |
          # Strip any CRLF that Windows runners may have produced.
          for f in dist/SHA256SUMS_*.txt; do
            [ -f "$f" ] && tr -d '\r' < "$f" >> dist/SHA256SUMS.tmp
          done
          sort -u dist/SHA256SUMS.tmp > dist/SHA256SUMS
          rm -f dist/SHA256SUMS.tmp dist/SHA256SUMS_*.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/app-v*.tar.gz
            dist/MiddlewareMonitor-*.exe
            dist/middleware-monitor-installer-*.run
            dist/install.sh
            dist/SHA256SUMS
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
